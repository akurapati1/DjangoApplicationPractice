# Render Blueprint - free tier. Deploy: https://render.com/deploy?repo=https://github.com/akurapati1/DjangoApplicationPractice
services:
  - type: web
    name: my-tennis-club
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd my_tennis_club && gunicorn my_tennis_club.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
