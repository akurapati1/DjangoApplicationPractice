{% extends "master.html" %}
{% block title %}My Tennis Club - Members{% endblock %}
{% block content %}
  <h1>Members</h1>
  <form method="get">
    <input type="search" name="q" value="{{ query }}" placeholder="Search by name">
    <button type="submit">Search</button>
  </form>
  <ul>
    {% for member in mymembers %}
      <li><a href="{% url 'details' member.id %}">{{ member.fullname }}</a></li>
    {% empty %}
      <li class="muted">No members found.</li>
    {% endfor %}
  </ul>
{% endblock %}
